lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

catalogs:
  default:
    cat-pkg:
      specifier: ^3.0.0
      version: 3.2.1

importers:
  .:
    devDependencies:
      typescript:
        specifier: ^5.5.0
        version: 5.5.4
  packages/app:
    dependencies:
      react:
        specifier: ^18.3.1
        version: 18.3.1
      ui:
        specifier: workspace:*
        version: link:../ui
      cat-pkg:
        specifier: 'catalog:'
        version: 3.2.1
      aliased:
        specifier: npm:real-pkg@^1.0.0
        version: real-pkg@1.2.3
  packages/ui:
    dependencies:
      '@tanstack/react-query':
        specifier: ^5.59.0
        version: 5.59.16(react@18.3.1)
      old-pkg:
        specifier: ^1.0.0
        version: 1.5.0

packages: {}

snapshots: {}
